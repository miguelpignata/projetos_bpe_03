<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutricionista</title>
</head>

<body>
    <center>
        <h1>Cadastrar time de Futebol</h1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identidade" name="id" required><br><br>
            <input type="text" placeholder="Nome do time" name="nome" required><br><br>
            <input type="number" placeholder="Vitorias" name="vitorias"><br><br>
            <input type="number" placeholder="Empates" name="empates" required><br><br>
            <input type="number" placeholder="Derrotas" name="derrotas" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
